[package]
name = "agent-harness-adapter-node"
description = "Node binding of agent-harness-adapter (npm @six5536/agent-harness-adapter-node)."
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
crate-type = ["cdylib"]
# The addon's symbols come from Node at load time: a test binary could not
# link them. Tested from Node (packages/agent-harness-adapter-node/test).
test = false
doctest = false

[dependencies]
agent-harness-adapter-bind = { path = "../agent-harness-adapter-bind" }
napi = { workspace = true }
napi-derive = { workspace = true }

[build-dependencies]
napi-build = { workspace = true }
