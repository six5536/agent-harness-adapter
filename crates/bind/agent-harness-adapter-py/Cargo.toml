[package]
name = "agent-harness-adapter-py"
description = "Python binding of agent-harness-adapter (PyPI six5536-agent-harness-adapter)."
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "_native"
crate-type = ["cdylib", "rlib"]
# No Rust test: the tests are in Python (tests/), and a test binary would
# need libpython at run time.
test = false
doctest = false

[dependencies]
agent-harness-adapter-bind.workspace = true
pyo3 = { workspace = true }

[build-dependencies]
pyo3-build-config = { workspace = true }

[features]
# maturin turns it on for wheels.
extension-module = ["pyo3/extension-module"]

[lints]
workspace = true
