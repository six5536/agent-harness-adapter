[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "six5536-agent-harness-adapter"
description = "One agent setup, every coding agent, from Python: install instructions, skills and hooks into Claude Code, Codex, Gemini CLI, Copilot, Cursor, OpenCode and more, and answer hooks in Claude Code's format in all of them."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [{ name = "six5536" }]
keywords = ["llm", "agent", "claude-code", "hooks"]
classifiers = [
  "Programming Language :: Rust",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: Implementation :: CPython",
  "License :: OSI Approved :: MIT License",
]
dynamic = ["version"]

[project.urls]
Homepage = "https://six5536.github.io/agent-harness-adapter/"
Documentation = "https://six5536.github.io/agent-harness-adapter/use/python/"
Repository = "https://github.com/six5536/agent-harness-adapter"

# @zen-impl: BND-4_AC-1 (abi3-py39 wheels and an sdist; release.yml builds them per platform)
[tool.maturin]
python-source = "python"
module-name = "agent_harness_adapter._native"
features = ["extension-module"]
