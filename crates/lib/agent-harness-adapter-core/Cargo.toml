[package]
name = "agent-harness-adapter-core"
description = "One agent setup, every coding agent: install instructions, skills and hooks, declared once or read from AGENTS.md and .agents/, into Claude Code, Codex, Gemini CLI, Copilot, Cursor, OpenCode and more; hooks speak Claude Code's protocol everywhere."
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
documentation = "https://docs.rs/agent-harness-adapter-core"
keywords = ["llm", "agent", "claude-code", "hooks", "cli"]
categories = ["command-line-utilities", "development-tools"]
include = ["/src", "/README.md", "/LICENSE"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
toml_edit.workspace = true
schemars = { workspace = true, optional = true }

[features]
# `JsonSchema` on the serialised result types, for tools that publish a
# schema of their JSON output.
schemars = ["dep:schemars"]

[package.metadata.docs.rs]
all-features = true

[dev-dependencies]
insta.workspace = true
proptest.workspace = true
