[package]
name = "agent-harness-kit-core"
description = "Plug a CLI into LLM agent harnesses (Claude Code, Codex, Gemini CLI, Copilot, Cursor, Factory, Pi, AGENTS.md): declare the integration once, install it everywhere with shared files written once, and speak every harness's hook protocol."
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
documentation = "https://docs.rs/agent-harness-kit-core"
keywords = ["llm", "agent", "claude-code", "hooks", "cli"]
categories = ["command-line-utilities", "development-tools"]
include = ["/src", "/README.md", "/LICENSE", "/CHANGELOG.md"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
toml_edit.workspace = true
schemars = { workspace = true, optional = true }

[features]
# `JsonSchema` on the serialised result types, for tools that publish a
# schema of their JSON output.
schemars = ["dep:schemars"]

[package.metadata.docs.rs]
all-features = true

[dev-dependencies]
insta.workspace = true
proptest.workspace = true
