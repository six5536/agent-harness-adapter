[package]
name = "agent-harness-adapter"
description = "One agent setup, every coding agent: instructions, skills and hooks kept once in AGENTS.md and .agents/, installed into Claude Code, Codex, Gemini CLI, Copilot, Cursor, OpenCode and more; hooks in Claude Code's format run everywhere."
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["llm", "agent", "claude-code", "hooks", "cli"]
categories = ["command-line-utilities", "development-tools"]
include = ["/src", "/README.md", "/LICENSE"]

[[bin]]
name = "agent-harness-adapter"
path = "src/main.rs"

[dependencies]
agent-harness-adapter-core = { workspace = true, features = ["schemars"] }
serde_json.workspace = true
clap.workspace = true
dialoguer.workspace = true
regex.workspace = true

[dev-dependencies]
assert_cmd.workspace = true
proptest.workspace = true
serde_json.workspace = true
