[package]
name = "agent-harness-kit"
description = "Shared plumbing for CLIs that plug into LLM agent harnesses: install/status of harness parts, marker regions, JSON settings merges, hook answers, findings and CLI output conventions."
version = "0.1.0"
authors = ["six5536 <10079653+six5536@users.noreply.github.com>"]
edition = "2024"
rust-version = "1.85"
readme = "README.md"
license = "MIT"
repository = "https://github.com/six5536/agent-harness-kit"
homepage = "https://github.com/six5536/agent-harness-kit"
documentation = "https://docs.rs/agent-harness-kit"
keywords = ["llm", "agent", "claude-code", "hooks", "cli"]
categories = ["command-line-utilities", "development-tools"]
include = ["/src", "/README.md", "/LICENSE", "/CHANGELOG.md"]

[dependencies]
serde = { version = "1", features = ["derive", "std"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
thiserror = "2.0"
toml_edit = "0.25"

[dev-dependencies]
insta = "1.47"
proptest = "1.11"
