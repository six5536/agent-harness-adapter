[workspace]
resolver = "3"
members = [
  "crates/lib/agent-harness-adapter-core",
  "crates/app/agent-harness-adapter",
  "crates/bind/agent-harness-adapter-bind",
  "crates/bind/agent-harness-adapter-py",
  "crates/bind/agent-harness-adapter-node",
]

[workspace.package]
version = "0.1.0"
authors = ["six5536 <10079653+six5536@users.noreply.github.com>"]
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/six5536/agent-harness-adapter"
homepage = "https://github.com/six5536/agent-harness-adapter"

[workspace.dependencies]
agent-harness-adapter-core = { version = "0.1.0", path = "crates/lib/agent-harness-adapter-core" }
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1", features = ["derive", "std"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
toml_edit = { version = "0.25", features = ["serde"] }
schemars = "1.2"
assert_cmd = "2"
insta = "1.47"
proptest = "1.11"
pyo3 = { version = "0.29", features = ["abi3-py39"] }
pyo3-build-config = "0.29"
napi = { version = "3", default-features = false, features = ["napi4"] }
napi-derive = "3"
napi-build = "2"
