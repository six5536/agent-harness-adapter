name: Publish

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  # The settings of the S3 store of the pack ci-cache-s3, which setup-tools passes to it,
  # because a composite action reads no variable or secret itself. The steps of
  # setup-tools and cache-save get the store's keys as inputs, which only the actions of
  # the pack read.
  CI_CACHE_S3_ENDPOINT: ${{ vars.CI_CACHE_S3_ENDPOINT }}
  CI_CACHE_S3_BUCKET: ${{ vars.CI_CACHE_S3_BUCKET }}
  CI_CACHE_S3_REGION: ${{ vars.CI_CACHE_S3_REGION }}

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  verify:
    name: verify the tag
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup-tools
        with:
          cache-s3-access-key-id: ${{ secrets.CI_CACHE_S3_ACCESS_KEY_ID }}
          cache-s3-secret-access-key: ${{ secrets.CI_CACHE_S3_SECRET_ACCESS_KEY }}
      - run: mise run version:check "${GITHUB_REF_NAME#v}"
      - run: mise run changelog:check "${GITHUB_REF_NAME#v}"
      - name: Save the caches
        if: hashFiles('.github/actions/cache-save/action.yml') != ''
        uses: ./.github/actions/cache-save
        with:
          access-key-id: ${{ secrets.CI_CACHE_S3_ACCESS_KEY_ID }}
          secret-access-key: ${{ secrets.CI_CACHE_S3_SECRET_ACCESS_KEY }}

  build:
    needs: verify
    uses: ./.github/workflows/build.yml
    secrets:
      CI_CACHE_S3_ACCESS_KEY_ID: ${{ secrets.CI_CACHE_S3_ACCESS_KEY_ID }}
      CI_CACHE_S3_SECRET_ACCESS_KEY: ${{ secrets.CI_CACHE_S3_SECRET_ACCESS_KEY }}

  publish:
    name: publish
    needs: [verify, build]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
    env:
      PUBLISH_DRY_RUN: ${{ vars.PUBLISH_DRY_RUN }}
      GH_TOKEN: ${{ github.token }}
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      HAS_CARGO_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN != '' }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup-tools
        with:
          cache-s3-access-key-id: ${{ secrets.CI_CACHE_S3_ACCESS_KEY_ID }}
          cache-s3-secret-access-key: ${{ secrets.CI_CACHE_S3_SECRET_ACCESS_KEY }}
      - run: mise run -q setup:ci
        env:
          TASK: publish
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - id: crates
        if: hashFiles('Cargo.lock') != ''
        run: |
          needed="$(mise run -q rust:publish:needed)"
          echo "needed=$needed" >> "$GITHUB_OUTPUT"
      - name: Authenticate to crates.io with trusted publishing
        id: crates-auth
        if: steps.crates.outputs.needed == 'true' && env.HAS_CARGO_TOKEN != 'true' && env.PUBLISH_DRY_RUN != 'true'
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
      - run: mise run publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN || steps.crates-auth.outputs.token }}
      - name: Save the caches
        if: hashFiles('.github/actions/cache-save/action.yml') != ''
        uses: ./.github/actions/cache-save
        with:
          access-key-id: ${{ secrets.CI_CACHE_S3_ACCESS_KEY_ID }}
          secret-access-key: ${{ secrets.CI_CACHE_S3_SECRET_ACCESS_KEY }}
