name: Publish

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  verify:
    name: verify the tag
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup-tools
      - run: mise run version:check "${GITHUB_REF_NAME#v}"
      - run: mise run changelog:check "${GITHUB_REF_NAME#v}"

  build:
    needs: verify
    uses: ./.github/workflows/build.yml

  publish:
    name: publish
    needs: [verify, build]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
    env:
      PUBLISH_DRY_RUN: ${{ vars.PUBLISH_DRY_RUN }}
      GH_TOKEN: ${{ github.token }}
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      HAS_CARGO_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN != '' }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup-tools
      - run: mise run -q setup:ci
        env:
          TASK: publish
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - id: crates
        if: hashFiles('Cargo.lock') != ''
        run: |
          needed="$(mise run -q rust:publish:needed)"
          echo "needed=$needed" >> "$GITHUB_OUTPUT"
      - name: Authenticate to crates.io with trusted publishing
        id: crates-auth
        if: steps.crates.outputs.needed == 'true' && env.HAS_CARGO_TOKEN != 'true' && env.PUBLISH_DRY_RUN != 'true'
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
      - run: mise run publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN || steps.crates-auth.outputs.token }}
