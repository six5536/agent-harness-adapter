name: Release

on:
  push:
    tags: ["v*"]

# Bypass sccache in CI.
env:
  CARGO_BUILD_RUSTC_WRAPPER: ""
  CARGO_TERM_COLOR: always

permissions:
  contents: read

# Never run two releases at once, and never cancel one in flight: a half-done
# publish is the worst outcome.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # 1. Is the tag coherent? Cheap checks first, so a typo fails in seconds.
  # ---------------------------------------------------------------------------
  meta:
    name: verify tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      prerelease: ${{ steps.v.outputs.prerelease }}
      npm_tag: ${{ steps.v.outputs.npm_tag }}
    steps:
      - uses: actions/checkout@v7

      - name: Derive version from tag
        id: v
        run: |
          version="${GITHUB_REF_NAME#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # A semver prerelease has a hyphen after the patch component.
          if [[ "$version" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "npm_tag=next" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "npm_tag=latest" >> "$GITHUB_OUTPUT"
          fi
          echo "Releasing $version"

      - name: Tag matches every version in the tree
        run: node scripts/verify-version.mjs "${{ steps.v.outputs.version }}"

      - name: CHANGELOG has a section for this version
        run: |
          version='${{ steps.v.outputs.version }}'
          if ! grep -qF "## [$version]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [$version]' section."
            exit 1
          fi

  # ---------------------------------------------------------------------------
  # 2. The same gate CI runs. Releases are rare; pay for the full signal.
  # ---------------------------------------------------------------------------
  checks:
    needs: meta
    uses: ./.github/workflows/checks.yml

  # ---------------------------------------------------------------------------
  # 3. Build each platform binary.
  # ---------------------------------------------------------------------------
  build:
    name: build ${{ matrix.pkg }}
    needs: meta
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux ships static musl: no glibc floor, and it runs on Alpine.
          # zigbuild supplies the C cross-compiler and sysroot.
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl, pkg: linux-x64, builder: zigbuild }
          - { os: ubuntu-latest, target: aarch64-unknown-linux-musl, pkg: linux-arm64, builder: zigbuild }
          - { os: macos-latest, target: x86_64-apple-darwin, pkg: darwin-x64, builder: cargo }
          - { os: macos-latest, target: aarch64-apple-darwin, pkg: darwin-arm64, builder: cargo }
          # x64 only: we never ship a binary no CI has executed.
          - { os: windows-latest, target: x86_64-pc-windows-msvc, pkg: win32-x64, builder: cargo }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Install the pinned toolchain and cross target
        run: |
          rustup toolchain install --profile minimal
          rustup target add ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-zigbuild
        if: matrix.builder == 'zigbuild'
        uses: taiki-e/install-action@v2.85.6
        with:
          tool: cargo-zigbuild

      # The zig version comes from .mise.toml, so CI and local builds agree.
      - name: Read the pinned zig version
        if: matrix.builder == 'zigbuild'
        id: zig
        run: |
          version="$(grep -oE '^zig = "[^"]+"' .mise.toml | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')"
          if [ -z "$version" ]; then
            echo "::error::could not read the zig version from .mise.toml"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install zig
        if: matrix.builder == 'zigbuild'
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ steps.zig.outputs.version }}
          cache-key: ${{ matrix.target }}

      - name: Build (zigbuild)
        if: matrix.builder == 'zigbuild'
        run: cargo zigbuild --release --locked --target ${{ matrix.target }} -p agent-harness-kit

      - name: Build (cargo)
        if: matrix.builder == 'cargo'
        run: cargo build --release --locked --target ${{ matrix.target }} -p agent-harness-kit

      - name: Stage binary into platform package
        shell: bash
        run: |
          bin="ahk"
          case "${{ matrix.target }}" in *windows*) bin="ahk.exe" ;; esac
          install -m 0755 "target/${{ matrix.target }}/release/$bin" \
            "packages/agent-harness-kit-${{ matrix.pkg }}/bin/$bin"

      - name: Assert Linux binaries are statically linked
        if: matrix.builder == 'zigbuild'
        run: |
          bin="packages/agent-harness-kit-${{ matrix.pkg }}/bin/ahk"
          if readelf -l "$bin" | grep -q "program interpreter"; then
            echo "::error::$bin is dynamically linked; expected a static musl build"
            exit 1
          fi

      # The aarch64 musl binary cannot run on the x64 runner; darwin-x64 runs
      # on the arm64 runner through Rosetta.
      - uses: actions/setup-node@v7
        with:
          node-version: 26

      - name: Smoke-test the release binary
        if: matrix.pkg != 'linux-arm64'
        shell: bash
        run: |
          bin="packages/agent-harness-kit-${{ matrix.pkg }}/bin/ahk"
          case "${{ matrix.target }}" in *windows*) bin="$bin.exe" ;; esac
          node scripts/release-smoke.mjs "$bin"

      # The launcher selects by the host's platform, so this runs only where
      # the built package matches the runner.
      - name: Smoke-test the npm launcher with the packed binary
        if: matrix.pkg == 'linux-x64' || matrix.pkg == 'darwin-arm64' || matrix.pkg == 'win32-x64'
        shell: bash
        run: node scripts/launcher-smoke.mjs

      - uses: actions/upload-artifact@v7
        with:
          name: ahk-${{ matrix.pkg }}
          path: packages/agent-harness-kit-${{ matrix.pkg }}/bin/ahk*
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # 3b. Python wheels (abi3: one per platform serves CPython 3.9+) and sdist.
  # ---------------------------------------------------------------------------
  python-wheels:
    name: wheel ${{ matrix.os }} ${{ matrix.target }}
    needs: meta
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64 }
          - { os: ubuntu-latest, target: aarch64 }
          - { os: macos-latest, target: x86_64 }
          - { os: macos-latest, target: aarch64 }
          - { os: windows-latest, target: x64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: auto
          args: --release --locked --out dist --manifest-path crates/bind/agent-harness-kit-py/Cargo.toml
      - uses: actions/upload-artifact@v7
        with:
          name: python-wheel-${{ matrix.os }}-${{ matrix.target }}
          path: dist/*.whl
          if-no-files-found: error

  python-sdist:
    name: sdist
    needs: meta
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist --manifest-path crates/bind/agent-harness-kit-py/Cargo.toml
      - uses: actions/upload-artifact@v7
        with:
          name: python-sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # 3c. Node addons. Linux builds against glibc 2.17 (zigbuild), so one
  # addon serves every glibc distribution of the last decade.
  # ---------------------------------------------------------------------------
  node-addons:
    name: node addon ${{ matrix.pkg }}
    needs: meta
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, glibc: .2.17, pkg: linux-x64-gnu, builder: zigbuild }
          - { os: ubuntu-latest, target: aarch64-unknown-linux-gnu, glibc: .2.17, pkg: linux-arm64-gnu, builder: zigbuild }
          - { os: macos-latest, target: x86_64-apple-darwin, pkg: darwin-x64, builder: cargo }
          - { os: macos-latest, target: aarch64-apple-darwin, pkg: darwin-arm64, builder: cargo }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, pkg: win32-x64, builder: cargo }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Install the pinned toolchain and target
        run: |
          rustup toolchain install --profile minimal
          rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-zigbuild
        if: matrix.builder == 'zigbuild'
        uses: taiki-e/install-action@v2.85.6
        with:
          tool: cargo-zigbuild
      - name: Read the pinned zig version
        if: matrix.builder == 'zigbuild'
        id: zig
        run: echo "version=$(grep -oE '^zig = "[^"]+"' .mise.toml | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')" >> "$GITHUB_OUTPUT"
      - name: Install zig
        if: matrix.builder == 'zigbuild'
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ steps.zig.outputs.version }}
          cache-key: node-${{ matrix.target }}
      - name: Build (zigbuild)
        if: matrix.builder == 'zigbuild'
        run: |
          cargo zigbuild --release --locked --target ${{ matrix.target }}${{ matrix.glibc }} -p agent-harness-kit-node
          cp target/${{ matrix.target }}/release/libagent_harness_kit_node.so packages/agent-harness-kit-node-${{ matrix.pkg }}/index.node
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - name: Build (cargo)
        if: matrix.builder == 'cargo'
        shell: bash
        run: node scripts/build-node.mjs --release --target ${{ matrix.target }} --out packages/agent-harness-kit-node-${{ matrix.pkg }}/index.node
      # Run the binding's tests on the addon itself, where the runner can
      # load it.
      - name: Test the addon
        if: matrix.pkg != 'linux-arm64-gnu' && matrix.pkg != 'darwin-x64'
        shell: bash
        run: AHK_NODE_ADDON="$(pwd -W 2>/dev/null || pwd)/packages/agent-harness-kit-node-${{ matrix.pkg }}/index.node" npm run test:node
      - uses: actions/upload-artifact@v7
        with:
          name: node-addon-${{ matrix.pkg }}
          path: packages/agent-harness-kit-node-${{ matrix.pkg }}/index.node
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # 4. Publish. Nothing here runs until the tag, the gate and the builds agree.
  # ---------------------------------------------------------------------------
  publish:
    name: publish
    needs: [meta, checks, build, python-wheels, python-sdist, node-addons]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm provenance
    env:
      VERSION: ${{ needs.meta.outputs.version }}
      NPM_TAG: ${{ needs.meta.outputs.npm_tag }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          registry-url: https://registry.npmjs.org

      - name: Install the pinned toolchain
        run: rustup toolchain install --profile minimal

      - name: Download platform binaries
        uses: actions/download-artifact@v8
        with:
          pattern: ahk-*
          path: artifacts

      - name: Place binaries into platform packages
        run: |
          for pkg in linux-x64 linux-arm64 darwin-x64 darwin-arm64; do
            install -m 0755 "artifacts/ahk-$pkg/ahk" "packages/agent-harness-kit-$pkg/bin/ahk"
          done
          install -m 0755 "artifacts/ahk-win32-x64/ahk.exe" "packages/agent-harness-kit-win32-x64/bin/ahk.exe"

      - name: Download the Node addons
        uses: actions/download-artifact@v8
        with:
          pattern: node-addon-*
          path: addons

      - name: Place the addons into their platform packages
        run: |
          for pkg in linux-x64-gnu linux-arm64-gnu darwin-x64 darwin-arm64 win32-x64; do
            cp "addons/node-addon-$pkg/index.node" "packages/agent-harness-kit-node-$pkg/index.node"
          done

      - name: Smoke-test the built binary
        run: |
          actual="$(./packages/agent-harness-kit-linux-x64/bin/ahk --version)"
          if [ "$actual" != "ahk $VERSION" ]; then
            echo "::error::binary reports '$actual', expected 'ahk $VERSION'"
            exit 1
          fi

      - name: Dry-run every publish before doing any of them
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          cargo publish --workspace --locked --dry-run
          for pkg in linux-x64 linux-arm64 darwin-x64 darwin-arm64 win32-x64; do
            npm publish "./packages/agent-harness-kit-$pkg" --dry-run --tag "$NPM_TAG"
          done
          npm publish ./packages/agent-harness-kit --dry-run --tag "$NPM_TAG"
          for pkg in linux-x64-gnu linux-arm64-gnu darwin-x64 darwin-arm64 win32-x64; do
            npm publish "./packages/agent-harness-kit-node-$pkg" --dry-run --tag "$NPM_TAG"
          done
          npm publish ./packages/agent-harness-kit-node --dry-run --tag "$NPM_TAG"

      # `--workspace` publishes the core before the CLI that depends on it.
      - name: Publish crates to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --workspace --locked

      # Platform packages first: the launcher names them as
      # optionalDependencies, so publishing it first would briefly point users
      # at versions that do not exist yet.
      - name: Publish platform packages to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          for pkg in linux-x64 linux-arm64 darwin-x64 darwin-arm64 win32-x64; do
            npm publish "./packages/agent-harness-kit-$pkg" --provenance --tag "$NPM_TAG"
          done

      - name: Publish the launcher to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish ./packages/agent-harness-kit --provenance --tag "$NPM_TAG"

      # Addon packages first, as for the launcher.
      - name: Publish the Node binding to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          for pkg in linux-x64-gnu linux-arm64-gnu darwin-x64 darwin-arm64 win32-x64; do
            npm publish "./packages/agent-harness-kit-node-$pkg" --provenance --tag "$NPM_TAG"
          done
          npm publish ./packages/agent-harness-kit-node --provenance --tag "$NPM_TAG"

  # PyPI by trusted publishing: the project's publisher names this workflow
  # and the `pypi` environment; no token is stored.
  publish-pypi:
    name: publish to PyPI
    needs: [meta, publish]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: python-*
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1

  # ---------------------------------------------------------------------------
  # 5. GitHub Release: archives, checksums, notes.
  # ---------------------------------------------------------------------------
  github-release:
    name: github release
    needs: [meta, publish, publish-pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Download platform binaries
        uses: actions/download-artifact@v8
        with:
          pattern: ahk-*
          path: artifacts

      - name: Build archives and checksums
        run: |
          mkdir -p dist/out
          for pkg in linux-x64 linux-arm64 darwin-x64 darwin-arm64; do
            stage="dist/stage/ahk-$VERSION-$pkg"
            mkdir -p "$stage"
            install -m 0755 "artifacts/ahk-$pkg/ahk" "$stage/ahk"
            cp README.md LICENSE CHANGELOG.md "$stage/"
            tar -czf "dist/out/ahk-$VERSION-$pkg.tar.gz" -C dist/stage "ahk-$VERSION-$pkg"
          done
          stage="dist/stage/ahk-$VERSION-win32-x64"
          mkdir -p "$stage"
          install -m 0755 "artifacts/ahk-win32-x64/ahk.exe" "$stage/ahk.exe"
          cp README.md LICENSE CHANGELOG.md "$stage/"
          (cd dist/stage && zip -qr "../out/ahk-$VERSION-win32-x64.zip" "ahk-$VERSION-win32-x64")
          cd dist/out && sha256sum ./*.tar.gz ./*.zip > SHA256SUMS && cat SHA256SUMS

      - name: Extract release notes from CHANGELOG
        run: |
          # The section for this version, up to the next "## " heading or the
          # trailing link-reference definitions.
          awk -v ver="## [$VERSION]" '
            index($0, ver) == 1 { found = 1; next }
            found && /^## / { exit }
            found && /^\[[^]]+\]: / { exit }
            found { print }
          ' CHANGELOG.md > dist/notes.md
          if [ ! -s dist/notes.md ]; then
            echo "::error::no release notes found for $VERSION in CHANGELOG.md"
            exit 1
          fi
          cat dist/notes.md

      - name: Create the release
        uses: softprops/action-gh-release@v3
        with:
          name: v${{ env.VERSION }}
          body_path: dist/notes.md
          prerelease: ${{ needs.meta.outputs.prerelease == 'true' }}
          files: |
            dist/out/*.tar.gz
            dist/out/*.zip
            dist/out/SHA256SUMS
