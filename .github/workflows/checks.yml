name: Checks

# The single source of truth for "is this tree good?". Called by ci.yml on every
# push/PR and by release.yml before it publishes anything, so the release gate
# cannot drift from CI.
on:
  workflow_call:

# sccache (configured in .cargo/config.toml) is bypassed in CI; we use
# Swatinem/rust-cache for caching instead.
env:
  CARGO_BUILD_RUSTC_WRAPPER: ""
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  test:
    # ubuntu is covered by the `coverage` job below (it runs the full suite while
    # measuring), so the plain matrix needs the cross-platform macos and windows
    # checks. Windows runs tests and doctests only: lint, docs and packaging are
    # OS-independent and already run on macos.
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      # No toolchain action: rust-toolchain.toml is the single source of truth
      # for the version and the components, and rustup honours it.
      - name: Install the pinned toolchain
        run: rustup toolchain install --profile minimal

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2.85.6
        with:
          tool: cargo-nextest

      - name: Format
        if: runner.os != 'Windows'
        run: cargo fmt --all -- --check

      - name: Clippy
        if: runner.os != 'Windows'
        run: cargo clippy --all-targets --all-features --locked -- -D warnings

      - name: Test
        run: cargo nextest run --all-features --locked

      - name: Doctests
        run: cargo test --doc --all-features --locked

      - name: Docs (warnings as errors)
        if: runner.os != 'Windows'
        run: cargo doc --no-deps --all-features --locked
        env:
          RUSTDOCFLAGS: -D warnings

      - name: Package (what crates.io would get)
        if: runner.os != 'Windows'
        run: cargo publish --dry-run --locked

  msrv:
    # The rust-version in Cargo.toml is a promise: build on exactly that
    # toolchain. The lockfile is resolved MSRV-aware (resolver 3).
    name: msrv
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Read rust-version and install it
        id: msrv
        run: |
          msrv="$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)"
          echo "version=$msrv" >> "$GITHUB_OUTPUT"
          rustup toolchain install "$msrv" --profile minimal

      - uses: Swatinem/rust-cache@v2

      - name: Check on the MSRV
        run: cargo +${{ steps.msrv.outputs.version }} check --locked --all-targets --all-features

  coverage:
    # Runs the full test suite on ubuntu under instrumentation and enforces the
    # line-coverage gate. Uses nightly so the `coverage(off)` markers on
    # untestable glue take effect (stable ignores them).
    name: coverage (ubuntu, nightly)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install nightly toolchain
        run: rustup toolchain install nightly --profile minimal --component llvm-tools-preview

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-llvm-cov and cargo-nextest
        uses: taiki-e/install-action@v2.85.6
        with:
          tool: cargo-llvm-cov,cargo-nextest

      - name: Coverage gate (line >= 90%)
        run: cargo +nightly llvm-cov nextest --all-features --locked --fail-under-lines 90

  deny:
    # Deterministic supply-chain checks only: these fail when *we* change
    # dependencies. Advisories are handled by audit.yml on a schedule so a new
    # RUSTSEC entry can never block an unrelated PR or an in-flight release.
    name: cargo-deny (licenses, bans, sources)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses bans sources
