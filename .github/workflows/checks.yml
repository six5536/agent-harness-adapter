name: Checks

# The single source of truth for "is this tree good?". Called by ci.yml on every
# push/PR and by release.yml before it publishes anything, so the release gate
# cannot drift from CI.
on:
  workflow_call:

# sccache (configured in .cargo/config.toml) is bypassed in CI; we use
# Swatinem/rust-cache for caching instead.
env:
  CARGO_BUILD_RUSTC_WRAPPER: ""
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  test:
    # ubuntu is covered by the `coverage` job below (it runs the full suite while
    # measuring), so the plain matrix needs the cross-platform macos and windows
    # checks. Windows runs tests and doctests only: lint, docs and packaging are
    # OS-independent and already run on macos.
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      # No toolchain action: rust-toolchain.toml is the single source of truth
      # for the version and the components, and rustup honours it.
      - name: Install the pinned toolchain
        run: rustup toolchain install --profile minimal

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2.85.6
        with:
          tool: cargo-nextest

      - name: Format
        if: runner.os != 'Windows'
        run: cargo fmt --all -- --check

      - name: Clippy
        if: runner.os != 'Windows'
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Test
        run: cargo nextest run --workspace --all-features --locked

      - name: Doctests
        run: cargo test --workspace --doc --all-features --locked

      - name: Docs (warnings as errors)
        if: runner.os != 'Windows'
        run: cargo doc --workspace --no-deps --all-features --locked
        env:
          RUSTDOCFLAGS: -D warnings

      - name: Package (what crates.io would get)
        if: runner.os != 'Windows'
        run: cargo publish --dry-run --locked --workspace

  msrv:
    # The rust-version in Cargo.toml is a promise: build on exactly that
    # toolchain. The lockfile is resolved MSRV-aware (resolver 3).
    name: msrv
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Read rust-version and install it
        id: msrv
        run: |
          msrv="$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)"
          echo "version=$msrv" >> "$GITHUB_OUTPUT"
          rustup toolchain install "$msrv" --profile minimal

      - uses: Swatinem/rust-cache@v2

      - name: Check on the MSRV
        run: cargo +${{ steps.msrv.outputs.version }} check --workspace --locked --all-targets --all-features

  coverage:
    # Runs the full test suite on ubuntu under instrumentation and enforces the
    # line-coverage gate. Uses nightly so the `coverage(off)` markers on
    # untestable glue take effect (stable ignores them).
    name: coverage (ubuntu, nightly)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install nightly toolchain
        run: rustup toolchain install nightly --profile minimal --component llvm-tools-preview

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-llvm-cov and cargo-nextest
        uses: taiki-e/install-action@v2.85.6
        with:
          tool: cargo-llvm-cov,cargo-nextest

      # One gate per crate (PLAN-011 N1): the library's lines must not carry
      # the CLI's or the bindings', nor the reverse. Tests that run the `ahk` binary count:
      # cargo-llvm-cov instruments it too.
      - name: Coverage gate (line >= 90%, per crate)
        run: |
          cargo +nightly llvm-cov nextest --workspace --all-features --locked --no-report
          cargo +nightly llvm-cov report --summary-only --ignore-filename-regex 'crates/(app|bind)/' --fail-under-lines 90
          cargo +nightly llvm-cov report --summary-only --ignore-filename-regex 'crates/(lib|bind)/' --fail-under-lines 90
          # The bindings' shared glue; the PyO3 and napi layers are tested
          # from Python and Node.
          cargo +nightly llvm-cov report --summary-only --ignore-filename-regex 'crates/(lib|app)/|crates/bind/agent-harness-kit-(py|node)/' --fail-under-lines 90

  node:
    # The npm launcher's unit tests (on every OS: it resolves Windows' .exe)
    # and one version across Cargo, packages/ and both lockfiles.
    name: npm launcher (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - name: Launcher tests
        run: npm run test:launcher
      - name: One version everywhere
        if: runner.os == 'Linux'
        run: npm run verify-version

  example:
    # A tool in another language, end to end through the ahk binary.
    name: example (python tool)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install the pinned toolchain
        run: rustup toolchain install --profile minimal
      - uses: Swatinem/rust-cache@v2
      - name: Build ahk
        run: cargo build --locked -p agent-harness-kit
      - name: Run the example
        run: python3 examples/python-tool/test_example.py target/debug/ahk

  python:
    # The Python binding, built as a wheel and tested on every OS, against
    # the ahk binary's own results (BND_P-1).
    name: python binding (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Install the pinned toolchain
        run: rustup toolchain install --profile minimal
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Build ahk and the wheel
        shell: bash
        run: |
          cargo build --locked -p agent-harness-kit
          python -m pip install "maturin>=1.9,<2"
          maturin build --locked --manifest-path crates/bind/agent-harness-kit-py/Cargo.toml -o dist
          python -m pip install --no-index --find-links dist six5536-agent-harness-kit
      - name: Test
        shell: bash
        # `pwd -W` gives Git Bash's directory as a Windows path, which Python
        # can run; elsewhere it fails and `pwd` is used.
        run: AHK="$(pwd -W 2>/dev/null || pwd)/target/debug/ahk" python -m unittest discover -s crates/bind/agent-harness-kit-py/tests -v

  deny:
    # Deterministic supply-chain checks only: these fail when *we* change
    # dependencies. Advisories are handled by audit.yml on a schedule so a new
    # RUSTSEC entry can never block an unrelated PR or an in-flight release.
    name: cargo-deny (licenses, bans, sources)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses bans sources
