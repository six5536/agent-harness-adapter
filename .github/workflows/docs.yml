name: Docs

# The documentation site (docs/) on GitHub Pages, built from one release tag:
# a successful run of publish.yml for a tag, not a dry run, deploys it, so that
# the site never shows a release that failed to publish, and a run by hand
# deploys a tag again.
# A prerelease leaves the site at the last release. The task site:build writes
# the Python reference with pdoc and the Node reference with TypeDoc, copies the
# JSON schemas, and builds the site. The tags of the releases before the move
# to the house packs have no such task, so a run by hand deploys none of them.
# Both triggers run on the default branch, which the environment github-pages
# allows to deploy.

on:
  workflow_run:
    workflows: [Publish]
    types: [completed]
  workflow_dispatch:
    inputs:
      ref:
        description: The release tag to build the site from.
        type: string
        required: true

permissions:
  contents: read

jobs:
  build:
    name: build
    # The tag of a run of publish.yml is its head_branch. Only the App's tags
    # start publish.yml, so its runs come from no fork.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      vars.PUBLISH_DRY_RUN != 'true' &&
      !contains(github.event.workflow_run.head_branch, '-'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.event.workflow_run.head_branch }}
      - uses: ./.github/actions/setup-tools
      - run: mise run -q setup:ci
      - run: mise run site:build
      - name: Upload the site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/dist

  deploy:
    name: deploy
    needs: build
    runs-on: ubuntu-latest
    # One deploy at a time; a newer one waits for the one deploying. The group
    # holds only the deploys, so that a run that skips its build never takes
    # the place of a deploy that waits.
    concurrency:
      group: pages
      cancel-in-progress: false
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
