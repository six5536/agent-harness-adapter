# The coverage tasks pass PACK_TESTS to the test tasks that their run names, which mise
# 2026.11.4, the release that setup-tools and the dev container pin, was tried with.
min_version = "2026.11.4"

[settings]
idiomatic_version_file_enable_tools = ["rust"]

[env]
RUST_NIGHTLY = "nightly-2026-11-05"

[tools]
cargo-binstall = "1.26.2"
"cargo:cargo-nextest" = "0.9.151"
"cargo:cargo-llvm-cov" = "0.9.1"
"cargo:cargo-deny" = "0.20.2"
# sccache, for CI, where only the environment turns it on, never .cargo/config.toml. The
# dev container pins its own in mise's system config, so that it works in every directory.
sccache = "0.19.0"

[tasks."audit:rust"]
hide = true
run = "cargo deny check advisories"

# A test of the CI tier is ignored and stands in a module named ci_only, and a test of
# the local tier stands in a module named local_only. The default filter of
# .config/nextest.toml leaves out both modules from every run, the coverage and the long
# tests included, because a test of the CI tier can fail on a developer's machine and in
# the coverage job, and CI skips a test of the local tier. Only test:ci:rust and
# test:local:rust set the default filter aside, each for its own tier. The CI tier leaves
# out the local tier, so a test in both modules is local.
#
# Runs the tests once and writes the HTML report, without each crate that sets
# `[package.metadata.coverage] skip = true` in its Cargo.toml.
[tasks."coverage:report:rust"]
hide = true
run = "node .config/mise/scripts/rust-coverage-check.mts report"

# Runs the tests once, then holds each crate of the workspace to COVERAGE_MIN_LINES
# by itself, and passes a crate without lines to measure with a note. A crate that
# another language tests sets `[package.metadata.coverage] skip = true` in its
# Cargo.toml, and the run leaves it out.
[tasks."coverage:check:rust"]
hide = true
run = "node .config/mise/scripts/rust-coverage-check.mts"

[tasks."setup:dev:rust"]
hide = true
run = "rustup toolchain install $RUST_NIGHTLY --profile minimal --component rustfmt,llvm-tools-preview"

[tasks."format:write:rust"]
hide = true
run = "cargo +$RUST_NIGHTLY fmt --all"

[tasks."format:check:rust"]
hide = true
run = "cargo +$RUST_NIGHTLY fmt --all -- --check"

[tasks."lint:check:rust"]
hide = true
run = "cargo clippy --workspace --all-targets -- -D warnings"

[tasks."lint:check:rust-lints"]
hide = true
run = "node .config/mise/scripts/rust-lints-check.mts"

[tasks."lint:fix:rust"]
hide = true
run = "cargo clippy --workspace --all-targets --fix --allow-dirty --allow-staged"

[tasks."test:fast:rust"]
hide = true
run = "cargo nextest run --workspace"

[tasks."test:fast:rust-scripts"]
hide = true
run = "node .config/mise/scripts/pack-tests.mts @six5536/rust .config/mise/scripts/rust-lints-check.test.mts .config/mise/scripts/rust-coverage-check.test.mts"

[tasks."coverage:check:rust-scripts"]
hide = true
env = { PACK_TESTS = "all" }
run = [{ task = "test:fast:rust-scripts" }]

[tasks."test:long:rust"]
hide = true
run = 'cargo nextest run --workspace --run-ignored only --no-tests=pass'

[tasks."test:ci:rust"]
hide = true
run = 'cargo nextest run --workspace --run-ignored only --no-tests=pass --ignore-default-filter -E "test(/(^|::)ci_only::/) and not test(/(^|::)local_only::/)"'

[tasks."test:local:rust"]
hide = true
run = 'cargo nextest run --workspace --run-ignored only --no-tests=pass --ignore-default-filter -E "test(/(^|::)local_only::/)"'

[tasks."docs:check:rust"]
hide = true
env = { RUSTDOCFLAGS = "-D warnings" }
run = "cargo doc --workspace --no-deps --locked"

[tasks."version:set:rust"]
hide = true
usage = 'arg "<version>"'
run = 'node .config/mise/scripts/rust-version.mts set "${usage_version?}"'

[tasks."version:list:rust"]
hide = true
run = "node .config/mise/scripts/rust-version.mts list"

[tasks."publish:rust"]
hide = true
run = "node .config/mise/scripts/rust-publish.mts"

[tasks."rust:publish:needed"]
hide = true
run = "node .config/mise/scripts/rust-publish.mts needed"

[tasks."prune:rust"]
hide = true
run = "node .config/mise/scripts/rust-prune.mts"
